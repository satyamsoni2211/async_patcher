[project]
name = "async-patcher"
version = "0.1.0"
description = "Patches asyncio to add to_process — offload CPU-bound callables to a separate process, get back an awaitable ProcessTask with full metadata"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

authors = [
  { name = "Satyam Soni", email = "satyamsoni@hotmail.co.uk" },
]

keywords = [
  "asyncio",
  "multiprocessing",
  "concurrency",
  "async",
  "process-pool",
  "task",
  "cpu-bound",
  "offload",
  "parallel",
  "executor",
]

classifiers = [
  # Maturity
  "Development Status :: 4 - Beta",

  # Audience
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Distributed Computing",

  # License
  "License :: OSI Approved :: MIT License",

  # Python versions
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3 :: Only",

  # Typing
  "Typing :: Typed",

  # OS
  "Operating System :: OS Independent",

  # Framework
  "Framework :: AsyncIO",
]

[project.urls]
Homepage       = "https://github.com/satyamsoni2211/async_patcher"
Repository     = "https://github.com/satyamsoni2211/async_patcher"
Issues         = "https://github.com/satyamsoni2211/async_patcher/issues"
Changelog      = "https://github.com/satyamsoni2211/async_patcher/blob/master/CHANGELOG.md"
Documentation  = "https://github.com/satyamsoni2211/async_patcher#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "mypy>=1.10",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["async_patcher", "tests"]
extend-exclude = [
  ".venv",
  "build",
  "dist",
]

[tool.ruff.lint]
# Comprehensive ruleset: pycodestyle, pyflakes, isort, bugbear, pyupgrade,
# simplify, comprehensions, pep8-naming, future-annotations. Add more rule
# codes here as needed.
#
# 3.9 compatibility note: PEP 604 `X | Y` union syntax is only valid in
# annotations (which become strings under `from __future__ import annotations`,
# PEP 563). Every .py file that uses `|` MUST have that future import — see
# the FA100 rule below, which flags `Optional[X]` in files missing it.
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "N",    # pep8-naming
  "FA",   # flake8-future-annotations
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "B011",  # `assert False` is a common sentinel in negative-path tests.
  "B017",  # `pytest.raises(Exception)` is fine when the test is exception-agnostic.
  "SIM105",  # try/except/pass is intentional in cancellation tests.
]

[tool.ruff.lint.isort]
known-first-party = ["async_patcher"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"