# Pre-commit hooks for async-patcher.
# Install:  uvx pre-commit install
# Run all:  uvx pre-commit run --all-files
#
# Hooks run on staged files only. Run --all-files once after installing to
# validate the entire repo.

repos:
  # Standard hygiene checks (trailing whitespace, EOF newline, yaml/toml syntax).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]

  # Ruff: linter + formatter. Configuration lives in pyproject.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      # Linter first: auto-fix what we can, then report anything left.
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatter second: applies remaining formatting changes (auto-format
      # on commit, as configured in pyproject.toml).
      - id: ruff-format
