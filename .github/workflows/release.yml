name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # required for OIDC trusted publisher

jobs:
  # ── 1. Build sdist + wheel ─────────────────────────────────────────────────
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hatch
        run: pip install hatch

      - name: Build wheel and sdist
        run: hatch build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ── 2. Run full test suite across all supported Pythons ────────────────────
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests (67 tests)
        run: uv run pytest -v --tb=short

      - name: Type-check (mypy --strict)
        run: uv run mypy --strict async_patcher

  # ── 3a. Publish to TestPyPI for release candidates (e.g. v0.2.0rc1) ───────
  publish-testpypi:
    name: Publish to TestPyPI (RC)
    needs: [build, test]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'rc')
    environment:
      name: testpypi
      url: https://test.pypi.org/project/async-patcher/

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        # Uses OIDC — no API token needed.
        # One-time TestPyPI setup:
        #   testpypi.org → Your projects → Publishing
        #   → Add trusted publisher → GitHub Actions
        #   owner=satyamsoni2211, repo=async_patcher,
        #   workflow=release.yml, environment=testpypi

  # ── 3b. Publish to PyPI for final tags (e.g. v0.2.0) ──────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [build, test]
    runs-on: ubuntu-latest
    if: "!contains(github.ref, 'rc')"
    environment:
      name: pypi
      url: https://pypi.org/project/async-patcher/

    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Uses OIDC — no API token needed.
        # One-time PyPI setup:
        #   pypi.org → Your projects → Publishing
        #   → Add trusted publisher → GitHub Actions
        #   owner=satyamsoni2211, repo=async_patcher,
        #   workflow=release.yml, environment=pypi

  # ── 4. Create GitHub Release with auto-generated notes ────────────────────
  github-release:
    name: Create GitHub Release
    needs: [publish-pypi]
    runs-on: ubuntu-latest
    if: "!contains(github.ref, 'rc')"
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ## Installation

            ```bash
            pip install async-patcher==${{ github.ref_name }}
            ```

            Full changelog: https://github.com/satyamsoni2211/async_patcher/blob/master/CHANGELOG.md